# Which drones exist. N is the length of this list - code never assumes N = 4.
# ip/port are the REAL drone addresses (used by the airlink / final_demo profiles).
# The sim profile ignores ip/port and gives each drone 127.0.0.1:<base_port + index>.
# start_slot is where the drone sits on the floor before take-off, in arena metres.
# Keep start slots well inside the camera's view AT HOVER HEIGHT: the C920 sees only
# ~1.8 m across its short (43 deg) axis at 1.2 m - slots at y = 0.9 left the frame in sim.

drones:
  - {id: 1, ip: 192.168.0.11, port: 23, marker_id: 1, start_slot: [0.60, 1.20]}
  - {id: 2, ip: 192.168.0.12, port: 23, marker_id: 2, start_slot: [1.20, 1.20]}
  - {id: 3, ip: 192.168.0.13, port: 23, marker_id: 3, start_slot: [1.80, 1.20]}
  - {id: 4, ip: 192.168.0.14, port: 23, marker_id: 4, start_slot: [2.40, 1.20]}
