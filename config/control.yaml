# Ground-station control loop settings.

rate_hz: 50                    # RC frames per second per drone (must stream continuously)

# Telemetry polling (requests sent by the link each tick / every N ticks)
telemetry:
  attitude_every_n_ticks: 1    # 50 Hz
  altitude_every_n_ticks: 1    # 50 Hz
  analog_every_n_ticks: 50     # 1 Hz (battery)

# RC channel defaults - order on the wire: roll, pitch, throttle, yaw, aux1, aux2, aux3, aux4
# Values copied from plutocontrol 2.0.0 (AUX4 = arm switch: 1500 armed, 1200 disarm).
rc:
  neutral: 1500
  aux1: 1500
  aux2: 1000                   # 1500 = developer/debug mode
  aux3: 1500
  aux4_disarmed: 1000
  aux4_armed: 1500
  aux4_disarm_cmd: 1200
  takeoff_throttle: 1800       # plutocontrol "box_arm" value sent with the TAKE_OFF command
  takeoff_hold_s: 0.5          # then throttle returns to 1500 (= hold altitude)

  disarm_throttle: 1300        # PlutoControl disarm(): throttle 1300 + AUX4 1200

# Stick directions - FIRST THING TO VERIFY at Airlink 1 (one small pulse per axis).
#   roll  +1: stick > 1500 -> right wing down (moves toward body -y)
#   pitch +1: stick > 1500 -> nose down (moves forward, body +x)
#   yaw   +1: stick > 1500 -> yaw angle increases (counter-clockwise seen from above)
rc_signs: {roll: 1, pitch: 1, yaw: 1}

# Link behaviour
link:
  auto_reconnect: true
  reconnect_backoff_max_s: 2.0

# Command-delay model (Smith-style prediction + estimator input model)
model:
  command_delay_s: 0.05        # ground -> firmware (Wi-Fi one way + FC loop); measure: RTT / 2
  residual_delay_s: 0.04       # what prediction can't remove - used by control/design.py
  predict_extra_s: 0.0

# Position loop. kp/kd from `python -m pluto_swarm.control.design` (residual delay 40 ms,
# attitude lag 0.15 s); re-run after Airlink 1 replaces the plant numbers.
position:
  kp: 2.36
  kd: 2.76
  ki: 0.0                      # drift is cancelled by the filter's bias state instead
  i_limit_m_s2: 0.3
  max_tilt_cmd_deg: 10.0       # command limit (firmware max is 20 deg)
  z_kp: 1.8
  z_ki: 0.0
  cancel_drift: true

# Throttle deadband workaround (architecture doc §5)
dither:
  enabled: true
  margin_us: 4                 # step = deadband + margin = 44 us = 11 cm/s

yaw:
  kp: 1.0                      # rad/s per rad of heading error
  max_rate_deg_s: 30

# Formation clock feedback (swarm/synchronizer.py)
sync:
  enabled: true
  k_f: 4.0
  deadzone_m: 0.05
  rate_min: 0.5
  rate_filter_s: 0.5
