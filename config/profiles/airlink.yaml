# airlink: real Pluto drones at Drona's site, Drona's camera rig (Logitech C920).

name: airlink
link:
  type: msp
  host_override: null          # use the IPs in swarm.yaml
  base_port: null
camera:
  type: opencv                 # V4L2 webcam via OpenCV (P1)
  device: 0                    # /dev/video0 on Drona's host - confirm before session 1
  model: config/camera/c920.yaml
  extrinsics: config/camera/extrinsics_airlink.yaml
sim:
  spawn: false
