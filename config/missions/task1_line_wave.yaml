# Task 1 - line formation with a travelling HEIGHT wave (architecture doc §6). Used from P3.
#
# Geometry confirmed from Drona's reference animation:
#   * drones hold fixed X and Y positions in a straight line along X;
#   * each drone moves ONLY vertically: z_i(t) = h + A sin(w t - k x_i);
#   * the crest travels along +X (left to right in the animation).
# The animation's axis glyph calls the vertical "Y"; in our arena frame that is Z.
#
# wavelength_m: null -> one wavelength spans the line (N * spacing), i.e. 90 deg
# between neighbours for N = 4 (crest on drone 1 while drone 3 is in the trough).

name: task1_line_wave
type: line_wave
wave_axis: z                 # oscillating coordinate (arena frame)
line_axis: x                 # direction the drones are lined up along
direction: 1                 # +1: crest moves towards +line_axis, -1: the other way
spacing_m: 0.60              # >= 0.514 m minimum (16.4 cm airframe + 15 cm gap + 2 x 10 cm error)
height_m: 1.0                # base height h
amplitude_m: 0.30            # A: heights stay within 0.7-1.3 m
period_s: 6.0                # peak climb rate A*2*pi/T = 0.31 m/s (alt-hold limit -1.0..+1.2 m/s)
wavelength_m: null           # null = N * spacing_m
centre: [1.5, 1.5]
ramp_periods: 2              # amplitude fades in/out over this many periods
cycles: 3                    # full-amplitude periods between the ramps
settle_s: 1.5
