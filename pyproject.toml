[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pluto-swarm"
version = "0.1.0"
description = "Synchronized multi-drone swarm for Pluto drones (Inter IIT Tech Meet 15.0, Drona Aviation)"
requires-python = ">=3.10"           # Ubuntu 22.04 ships 3.10 - keep code compatible
dependencies = [
    "numpy>=1.21",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "opencv-contrib-python>=4.7", "plutocontrol==2.0.0"]
vision = ["opencv-contrib-python>=4.7"]   # ArUco + PnP + USB camera (C920)
realsense = ["pyrealsense2"]              # final-demo D455f, colour stream only
plutocontrol = ["plutocontrol==2.0.0"]    # fallback link (link.type: plutocontrol)

[project.scripts]
pluto-run = "pluto_swarm.apps.run_mission:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pluto_swarm*", "sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
